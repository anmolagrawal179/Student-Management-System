<app-header></app-header>
<div class="container">
<h4 class="text-center">Student List</h4>
<br/>
<table class ="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Student Id</th>
            <th>Student Name</th>
            <th>Student Age</th>
            <th>Student Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        @for(student of students; track student.id;)
       { <tr>
            <td>{{student.id}}</td>
            <td>{{student.name}}</td>
            <td>{{student.age}}</td>
            <td>{{student.email}}</td>
            <td>
                <button (click)="updateStudent(student.id)" class ="btn btn-info">Update</button>
                <button (click)="deleteStudent(student.id)" class="btn btn-danger" style="margin-left: 10px;">Delete</button>
            </td>
        </tr>}
    </tbody>
</table>
</div>
<app-footer></app-footer>
