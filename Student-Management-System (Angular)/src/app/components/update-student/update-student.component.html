
<app-header></app-header>
<div class="container">
<h4 class="text-center">Update Student</h4>

@if(isStudentUpdated){
  <div class="alert alert-success">
    Student updated successfully...!
  </div>
}


<form (ngSubmit)="onSubmit()">
  <div>
    <label for="name" class="form-label">Student Name:</label>
    <input type="text" class="form-control" id="name"  name="name" [(ngModel)]="student.name">
  </div>
  <br/>
  <div>
    <label for="age" class="form-label">Student Age:</label>
    <input type="number" class="form-control" id="age"  name="age" [(ngModel)]="student.age">
  </div>
  <br/>
  <div>
    <label for="email" class="form-label">Student Email:</label>
    <input type="email" class="form-control" id="email" name="email" [(ngModel)]="student.email">
  </div>
  <br/>
  <button type="submit" class="btn btn-success">Submit</button>

</form>
</div>
<app-footer></app-footer>
